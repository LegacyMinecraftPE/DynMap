<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>DynMap</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #222;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #ddd
    }

    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: linear-gradient(#3a3a3a, #2a2a2a);
      border-bottom: 1px solid #111;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 12px;
      z-index: 30;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .5)
    }

    #toolbar .logo {
      font-weight: bold;
      font-size: 14px;
      color: #eee;
      letter-spacing: .5px;
      margin-right: 6px
    }

    #toolbar .sep {
      width: 1px;
      height: 20px;
      background: #444
    }

    #status-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #aaa
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c0392b;
      flex-shrink: 0
    }

    .dot.ok {
      background: #27ae60
    }

    .dot.load {
      background: #f39c12
    }

    #toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #aaa
    }

    #lu {
      font-size: 10px;
      color: #666
    }

    #toolbar select,
    #toolbar button {
      background: #3a3a3a;
      border: 1px solid #555;
      color: #ccc;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
      height: 22px;
      outline: none
    }

    #toolbar select:hover,
    #toolbar button:hover {
      background: #484848
    }

    #panel {
      position: fixed;
      top: 36px;
      left: 0;
      bottom: 0;
      width: 200px;
      background: #2b2b2b;
      border-right: 2px solid #111;
      display: flex;
      flex-direction: column;
      z-index: 20;
      box-shadow: 2px 0 8px rgba(0, 0, 0, .4)
    }

    .phead {
      padding: 7px 10px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      background: #252525;
      border-bottom: 1px solid #111
    }

    #plist {
      flex: 1;
      overflow-y: auto
    }

    .prow {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      transition: background .1s
    }

    .prow:hover {
      background: #333
    }

    .prow:active {
      background: #3a3a3a
    }

    .pdot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #e74c3c;
      flex-shrink: 0;
      box-shadow: 0 0 4px rgba(231, 76, 60, .6)
    }

    .pname {
      font-size: 12px;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pxyz {
      font-size: 10px;
      color: #666;
      margin-top: 1px
    }

    .no-p {
      padding: 8px 10px;
      font-size: 11px;
      color: #555
    }

    #world-info {
      padding: 7px 10px;
      border-top: 1px solid #111;
      font-size: 10px;
      color: #555;
      background: #252525
    }

    #cw {
      position: fixed;
      top: 36px;
      left: 200px;
      right: 0;
      bottom: 0
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: grab;
      touch-action: none
    }

    canvas.drag {
      cursor: grabbing
    }

    #hud {
      position: fixed;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, .7);
      border: 1px solid #444;
      padding: 4px 9px;
      font-size: 11px;
      color: #aaa;
      border-radius: 3px;
      z-index: 25;
      pointer-events: none;
      font-family: monospace
    }

    #zoom-ctrl {
      position: fixed;
      bottom: 36px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 25
    }

    #zoom-ctrl button {
      width: 28px;
      height: 28px;
      background: #3a3a3a;
      border: 1px solid #555;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .4)
    }

    #zoom-ctrl button:hover {
      background: #484848
    }

    #zoom-ctrl button:active {
      background: #555
    }

    #zval {
      text-align: center;
      font-size: 10px;
      color: #666;
      padding: 2px 0
    }

    @media(max-width:600px) {
      #panel {
        display: none
      }

      #cw {
        left: 0
      }

      #toolbar .logo {}
    }

    .ss-opt:hover {
      background: #3a3a3a;
    }
  </style>
</head>

          ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
          var fs = 11; ctx.font = "bold " + fs + "px Arial,sans-serif";
          var tw = ctx.measureText(p.name).width;
          ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(pos.x + r + 2, pos.y - fs + 5, tw + 4, fs + 2);
          ctx.fillStyle = "#fff"; ctx.fillText(p.name, pos.x + r + 4, pos.y + 4);
        });
      }
    }

    function setZoom(z) { zoom = Math.max(1, Math.min(12, Math.round(z))); document.getElementById("zval").textContent = zoom + "x"; draw(); }
    function setDot(ok) { document.getElementById("dot").className = ok ? "dot ok" : "dot"; }
    function centerOnPlayers() {
      if (!data || !data.pl || data.pl.length === 0) return;
      var sx = 0, sz = 0; data.pl.forEach(function (p) { sx += p.x; sz += p.z; });
      viewCX = sx / data.pl.length; viewCZ = sz / data.pl.length; panX = 0; panY = 0;
    }

    var currentWorld = null;
    var knownWorlds = [];

    document.getElementById("world-select").addEventListener("change", function(e) {
      if (e.target.value !== currentWorld) {
        currentWorld = e.target.value;
        fetchMapData(true);
      }
    });

    function fetchWorlds(isFirst) {
      fetch("worlds.json?_=" + Date.now()).then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(function (w) {
        if (!Array.isArray(w) || w.length === 0) return;
        knownWorlds = w;

        var sel = document.getElementById("world-select");
        if (w.length > 1) {
          sel.style.display = "inline-block";
          document.getElementById("wname").style.display = "none";
          sel.innerHTML = "";
          w.forEach(function(wn) {
            var opt = document.createElement("option");
            opt.value = wn; opt.textContent = wn;
            if (wn === currentWorld) opt.selected = true;
            sel.appendChild(opt);
          });
        } else {
          sel.style.display = "none";
          document.getElementById("wname").style.display = "inline";
          document.getElementById("wname").textContent = w[0];
        }

        if (isFirst || !currentWorld || w.indexOf(currentWorld) === -1) {
          currentWorld = w[0];
          fetchMapData(true);
        } else {
          fetchMapData(false);
        }
      }).catch(function (e) {
        if (!currentWorld) {
          currentWorld = "";
          fetchMapData(true);
        }
      });
    }

    function fetchMapData(isFirst) {
      var mapUrl = currentWorld ? "mapdata_" + currentWorld + ".json" : "mapdata.json";
      fetch(mapUrl + "?_=" + Date.now()).then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(function (d) {
        if (!data) data = {};
        data.mp = d.mp;
        data.lv = d.lv;
        if (isFirst) {
          fetchPlayerData(true);
        } else {
          updateMasterBuffer(data);
          draw();
        }
      }).catch(function (e) { setDot(false); document.getElementById("stxt").textContent = "Error"; });
    }

    function fetchPlayerData(isFirst) {
      var plUrl = currentWorld ? "players_" + currentWorld + ".json" : "players.json";
      fetch(plUrl + "?_=" + Date.now()).then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(function (d) {
        if (!data) data = {};
        data.pl = d.pl;

        if (isFirst) {
          if (data.pl && data.pl.length > 0) {
            var sx = 0, sz = 0; data.pl.forEach(function (p) { sx += p.x; sz += p.z; });
            viewCX = sx / data.pl.length; viewCZ = sz / data.pl.length;
          } else { viewCX = 128; viewCZ = 128; }
          panX = 0; panY = 0;
          updateMasterBuffer(data);
        } else if (followPlayers && data.pl && data.pl.length > 0) {
          centerOnPlayers();
        }

        setDot(true); document.getElementById("stxt").textContent = "Online";
        var n = data.pl ? data.pl.length : 0; document.getElementById("pc").textContent = "(" + n + ")";
        var list = document.getElementById("plist"); list.innerHTML = "";
        if (n === 0) { list.innerHTML = '<div class="no-p">No players online</div>'; } else {
          data.pl.forEach(function (p) {
            var row = document.createElement("div"); row.className = "prow";
            row.innerHTML = '<div class="pdot"></div><div><div class="pname">' + p.name + '</div><div class="pxyz">' + Math.round(p.x) + ', ' + Math.round(p.y) + ', ' + Math.round(p.z) + '</div></div>';
            row.addEventListener("click", function () { viewCX = p.x; viewCZ = p.z; panX = 0; panY = 0; followPlayers = false; document.getElementById("btn-follow").textContent = "Follow Players"; draw(); });
            list.appendChild(row);
          });
        }
        var now = new Date(); document.getElementById("lu").textContent = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0") + ":" + now.getSeconds().toString().padStart(2, "0");

        if (!isFirst) draw(); // Only trigger draw here if it's an interval update, since map update handles full re-buffer
      }).catch(function (e) { setDot(false); document.getElementById("stxt").textContent = "Error"; });
    }

    document.getElementById("btn-follow").addEventListener("click", function () { followPlayers = !followPlayers; this.textContent = followPlayers ? "Following..." : "Follow Players"; if (followPlayers && data) { centerOnPlayers(); draw(); } });
    var ssMenu = document.getElementById("screenshot-menu");
    document.getElementById("btn-screenshot").addEventListener("click", function (e) {
      e.stopPropagation();
      ssMenu.style.display = ssMenu.style.display === "none" ? "block" : "none";
    });
    document.addEventListener("click", function () {
      ssMenu.style.display = "none";
    });
    var ssOpts = document.querySelectorAll(".ss-opt");
    for (var k = 0; k < ssOpts.length; k++) {
      ssOpts[k].addEventListener("click", function () {
        var type = this.getAttribute("data-type");
        var a = document.createElement("a");
        if (type === "view") {
          a.href = canvas.toDataURL("image/png");
          a.download = "dynmap_" + viewMode + "_view_" + Date.now() + ".png";
        } else {
          if (viewMode === "3d") {
            var fc = document.createElement("canvas");
            fc.width = 8192; fc.height = 8192;
            var fctx = fc.getContext("2d");
            fctx.fillStyle = "#1a1a1a"; fctx.fillRect(0, 0, 8192, 8192);
            for (var i = 0; i < 4; i++) {
              for (var j = 0; j < 4; j++) {
                fctx.drawImage(map3D[i][j], i * MAP3D_TILE_SIZE, j * MAP3D_TILE_SIZE);
              }
            }
            a.href = fc.toDataURL("image/png");
          } else {
            a.href = mapCanvas2D.toDataURL("image/png");
          }
          a.download = "dynmap_" + viewMode + "_full_" + Date.now() + ".png";
        }
        a.click();
      });
    }
    canvas.addEventListener("mousedown", function (e) { drag = true; dsx = e.clientX; dsy = e.clientY; dpx = panX; dpy = panY; followPlayers = false; document.getElementById("btn-follow").textContent = "Follow Players"; canvas.classList.add("drag"); });
    window.addEventListener("mousemove", function (e) {
      if (drag) { panX = dpx + e.clientX - dsx; panY = dpy + e.clientY - dsy; draw(); }
      var w = c2w(e.clientX - panelW(), e.clientY - 36); document.getElementById("hud").textContent = "X " + Math.round(w.x) + " \u00a0 Z " + Math.round(w.z);
    });
    window.addEventListener("mouseup", function () { drag = false; canvas.classList.remove("drag"); });
    canvas.addEventListener("wheel", function (e) {
      e.preventDefault(); var before = c2w(e.clientX - panelW(), e.clientY - 36); setZoom(zoom + (e.deltaY < 0 ? 1 : -1)); var after = c2w(e.clientX - panelW(), e.clientY - 36);
      if (viewMode === "3d") { panX += (after.x - before.x) * (zoom / 2) * 16; panY += (after.z - before.z) * (zoom / 2) * 8; } else { panX += (after.x - before.x) * zoom; panY += (after.z - before.z) * zoom; } draw();
    }, { passive: false });
    document.getElementById("zp").addEventListener("click", function () { setZoom(zoom + 1); }); document.getElementById("zm").addEventListener("click", function () { setZoom(zoom - 1); });
    var t0 = null, t1 = null, pd0 = 0, pz0 = 0;
    canvas.addEventListener("touchstart", function (e) { e.preventDefault(); if (e.touches.length === 1) { drag = true; dsx = e.touches[0].clientX; dsy = e.touches[0].clientY; dpx = panX; dpy = panY; followPlayers = false; } else if (e.touches.length === 2) { drag = false; pd0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); pz0 = zoom; } }, { passive: false });
    canvas.addEventListener("touchmove", function (e) { e.preventDefault(); if (e.touches.length === 1 && drag) { panX = dpx + e.touches[0].clientX - dsx; panY = dpy + e.touches[0].clientY - dsy; draw(); } else if (e.touches.length === 2) { setZoom(pz0 * Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) / pd0); } }, { passive: false });
    canvas.addEventListener("touchdown", function () { drag = false; });
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>

</html>
